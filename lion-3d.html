<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9ed4f5">
<title>🦁 Лев Саванны</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    background: #0d1230;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }
  #hint {
    position: fixed; top: calc(14px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    padding: 8px 16px;
    background: rgba(20, 16, 12, 0.5);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    color: #fff; font-size: 13px; white-space: nowrap;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    pointer-events: none;
    transition: opacity 1s ease;
  }
  #loading {
    position: fixed; inset: 0; z-index: 9;
    display: flex; align-items: center; justify-content: center;
    background: #0d1230; color: #fff; font-size: 15px;
  }
  #err {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 24px; text-align: center;
    background: rgba(10, 8, 6, 0.9); color: #fff;
  }
  #err h2 { font-size: 18px; }
  #err p { font-size: 13px; color: #f0c9a0; word-break: break-word; }
  #ui {
    position: fixed; left: 0; right: 0;
    bottom: 0;
    display: flex; gap: 10px;
    padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
    justify-content: center;
  }
  #ui button {
    flex: 1 1 0;
    max-width: 132px;
    height: 62px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 18px;
    background: rgba(28, 22, 16, 0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  #ui button:active { transform: scale(0.93); background: rgba(28,22,16,0.75); }
  #ui button .ico { font-size: 22px; line-height: 1; }
</style>
<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('err');
  if (box) {
    box.style.display = 'flex';
    document.getElementById('errMsg').textContent = 'Ошибка: ' + (e.message || 'неизвестная');
  }
});
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">🦁 Крути одним пальцем, зум — двумя</div>
<div id="loading">⏳ Загружаю 3D…</div>
<div id="err">
  <h2>⚠️ Не удалось загрузить 3D</h2>
  <p id="errMsg"></p>
</div>
<div id="ui">
  <button id="btnRoar"><span class="ico">🔊</span>Рычать</button>
  <button id="btnPet"><span class="ico">❤️</span>Погладить</button>
  <button id="btnFeed"><span class="ico">🍖</span>Покормить</button>
  <button id="btnNight"><span class="ico">🌙</span><span id="nightLabel">Ночь</span></button>
</div>
