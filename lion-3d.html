<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9ed4f5">
<title>🦁 Лев Саванны</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    background: #0d1230;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }
  #hint {
    position: fixed; top: calc(14px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    padding: 8px 16px;
    background: rgba(20, 16, 12, 0.5);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    color: #fff; font-size: 13px; white-space: nowrap;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    pointer-events: none;
    transition: opacity 1s ease;
  }
  #err {
    position: fixed; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 24px; text-align: center;
    background: rgba(10, 8, 6, 0.9); color: #fff;
  }
  #err h2 { font-size: 18px; }
  #err p { font-size: 13px; color: #f0c9a0; word-break: break-word; }
  #ui {
    position: fixed; left: 0; right: 0;
    bottom: 0;
    display: flex; gap: 10px;
    padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
    justify-content: center;
  }
  #ui button {
    flex: 1 1 0;
    max-width: 132px;
    height: 62px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 18px;
    background: rgba(28, 22, 16, 0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  #ui button:active { transform: scale(0.93); background: rgba(28,22,16,0.75); }
  #ui button .ico { font-size: 22px; line-height: 1; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">🦁 Крути одним пальцем, зум — двумя</div>
<div id="err">
  <h2>⚠️ Не удалось загрузить 3D</h2>
  <p id="errMsg"></p>
</div>
<div id="ui">
  <button id="btnRoar"><span class="ico">🔊</span>Рычать</button>
  <button id="btnPet"><span class="ico">❤️</span>Погладить</button>
  <button id="btnFeed"><span class="ico">🍖</span>Покормить</button>
  <button id="btnNight"><span class="ico">🌙</span><span id="nightLabel">Ночь</span></button>
</div>

<script type="module">
function showErr(msg) {
  const box = document.getElementById('err');
  box.style.display = 'flex';
  document.getElementById('errMsg').textContent = String(msg && msg.message ? msg.message : msg);
}
window.addEventListener('error', (e) => showErr(e.message));
window.addEventListener('unhandledrejection', (e) => showErr(e.reason));

async function loadThree() {
  const urls = [
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
    'https://unpkg.com/three@0.160.0/build/three.module.js',
    'https://esm.sh/three@0.160.0'
  ];
  let lastErr;
  for (const u of urls) {
    try { return await import(u); } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('CDN недоступен');
}

(async () => {
const THREE = await loadThree();


  /* ---------- Renderer / Scene / Camera ---------- */
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;

  const scene = new THREE.Scene();
  const SKY = new THREE.Color(0x9ed4f5);
  const NIGHT = new THREE.Color(0x0d1230);
  scene.background = SKY.clone();
  scene.fog = new THREE.Fog(SKY.clone(), 22, 55);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 120);
  const TARGET = new THREE.Vector3(0, 1.5, 0);
  const cam = { radius: 9, phi: 1.12, theta: 0.15 };
  function updateCamera() {
    camera.position.setFromSphericalCoords(cam.radius, cam.phi, cam.theta).add(TARGET);
    camera.lookAt(TARGET);
  }
  updateCamera();

  /* ---------- Lights ---------- */
  const hemiSky = new THREE.Color(0xbfe3ff), hemiGroundN = new THREE.Color(0x2a2f52);
  const hemi = new THREE.HemisphereLight(hemiSky.clone(), new THREE.Color(0x8a6f4d), 0.95);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffe8c0, 1.4);
  sun.position.set(6, 10, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
  sun.shadow.camera.updateProjectionMatrix();
  scene.add(sun);
  const moon = new THREE.DirectionalLight(0x8fa8ff, 0);
  moon.position.set(-5, 8, -6);
  scene.add(moon);

  /* ---------- Materials helper ---------- */
  const M = (c) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.95, metalness: 0 });

  /* ---------- World: floating island ---------- */
  const world = new THREE.Group();
  scene.add(world);

  const grass = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.9, 0.7, 9, 1), M(0xa9c25b));
  grass.position.y = -0.35;
  grass.receiveShadow = true;
  world.add(grass);

  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(3.9, 4.05, 0.9, 9, 1), M(0x8a6f4d));
  dirt.position.y = -1.1;
  world.add(dirt);

  const rockBase = new THREE.Mesh(new THREE.ConeGeometry(4.05, 5.2, 8, 1), M(0x7d7466));
  rockBase.rotation.x = Math.PI;
  rockBase.position.y = -3.9;
  world.add(rockBase);

  function addTree(x, z, s) {
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.16, 0.9, 6), M(0x7a5233));
    trunk.position.y = 0.45;
    trunk.castShadow = true;
    t.add(trunk);
    const leafM = M(0x5f9e4a);
    const l1 = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.1, 7), leafM);
    l1.position.y = 1.35; l1.castShadow = true;
    const l2 = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.85, 7), leafM);
    l2.position.y = 2.0; l2.castShadow = true;
    t.add(l1, l2);
    t.position.set(x, 0, z);
    t.scale.setScalar(s);
    world.add(t);
  }
  addTree(-2.2, -1.0, 1.1);
  addTree(2.4, 0.6, 0.8);

  const rockM = M(0x8d8578);
  [[-1.1, 1.6, 0.5], [1.5, -1.8, 0.7], [0.4, 2.6, 0.35]].forEach(([x, z, s]) => {
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4, 0), rockM);
    r.position.set(x, s * 0.25, z);
    r.scale.setScalar(s);
    r.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    r.castShadow = true;
    world.add(r);
  });

  const cloudM = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1 });
  function addCloud(angle, h, r) {
    const g = new THREE.Group();
    [[0, 0, 0, 0.7], [0.7, -0.1, 0.2, 0.5], [-0.7, -0.15, -0.1, 0.45]].forEach(([x, y, z, s]) => {
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), cloudM);
      m.position.set(x, y, z);
      g.add(m);
    });
    g.position.set(Math.cos(angle) * r, h, Math.sin(angle) * r);
    g.userData.angle = angle;
    world.add(g);
    return g;
  }
  const clouds = [addCloud(0.6, 4.2, 8), addCloud(2.7, 5.2, 9.5), addCloud(4.4, 3.6, 7.5)];

  /* ---------- Stars ---------- */
  const starGeo = new THREE.BufferGeometry();
  {
    const pos = [];
    for (let i = 0; i < 350; i++) {
      const v = new THREE.Vector3().randomDirection().multiplyScalar(45 + Math.random() * 15);
      v.y = Math.abs(v.y) * 0.8 + 2;
      pos.push(v.x, v.y, v.z);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  }
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.5, transparent: true, opacity: 0, sizeAttenuation: true, fog: false
  }));
  scene.add(stars);

  /* ---------- Lion ---------- */
  const lion = new THREE.Group();
  world.add(lion);

  const fur = M(0xe29a4b), maneM = M(0xb2602c), lightM = M(0xf2d6a0), darkM = M(0x5c3a1e);

  const body = new THREE.Group();
  lion.add(body);

  const torso = new THREE.Mesh(new THREE.SphereGeometry(0.85, 8, 6), fur);
  torso.scale.set(1.35, 1, 1);
  torso.position.set(0, 0.95, -0.2);
  torso.castShadow = true;
  body.add(torso);

  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.72, 8, 6), lightM);
  belly.scale.set(1.1, 0.7, 1);
  belly.position.set(0, 0.62, 0.05);
  body.add(belly);

  function leg(x, z) {
    const g = new THREE.Group();
    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.19, 0.75, 6), fur);
    l.position.y = 0.375;
    l.castShadow = true;
    const paw = new THREE.Mesh(new THREE.SphereGeometry(0.19, 6, 5), lightM);
    paw.position.set(0, 0.12, 0.05);
    g.add(l, paw);
    g.position.set(x, 0, z);
    body.add(g);
  }
  leg(-0.44, -0.55); leg(0.44, -0.55); leg(-0.42, 0.55); leg(0.42, 0.55);

  const TAIL_SEGS = 5;
  const tailSegs = [];
  let tailParent = body, tailY = 1.25, tailZ = -1.05;
  for (let i = 0; i < TAIL_SEGS; i++) {
    const seg = new THREE.Group();
    seg.position.set(0, i === 0 ? tailY : 0.04, i === 0 ? tailZ : -0.3);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.085 - i * 0.008, 6, 5), fur);
    ball.position.z = -0.15;
    seg.add(ball);
    tailParent.add(seg);
    tailSegs.push(seg);
    tailParent = seg;
  }
  const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 5), darkM);
  tuft.position.z = -0.3;
  tuft.scale.set(1, 1, 1.3);
  tailSegs[TAIL_SEGS - 1].add(tuft);
  tailSegs[TAIL_SEGS - 1].rotation.x = 0.9;

  const head = new THREE.Group();
  head.position.set(0, 1.55, 0.62);
  body.add(head);

  const mane = new THREE.Mesh(new THREE.IcosahedronGeometry(1.0, 0), maneM);
  mane.scale.set(1.02, 1, 0.72);
  mane.position.z = -0.18;
  mane.castShadow = true;
  head.add(mane);

  const headSphere = new THREE.Mesh(new THREE.SphereGeometry(0.62, 7, 6), fur);
  headSphere.position.set(0, 0.05, 0.25);
  headSphere.castShadow = true;
  head.add(headSphere);

  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.26, 0.32), lightM);
  snout.position.set(0, -0.14, 0.75);
  head.add(snout);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.1, 0.12), darkM);
  nose.position.set(0, -0.02, 0.88);
  head.add(nose);

  const mouthInner = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.22, 0.24), M(0x8a2f2f));
  mouthInner.position.set(0, -0.3, 0.68);
  head.add(mouthInner);

  const jaw = new THREE.Group();
  jaw.position.set(0, -0.24, 0.45);
  const jawMesh = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.11, 0.5), lightM);
  jawMesh.position.set(0, -0.04, 0.2);
  jaw.add(jawMesh);
  head.add(jaw);

  const eyeGeo = new THREE.SphereGeometry(0.095, 6, 5);
  const eyeM = M(0x241a12);
  const eyeL = new THREE.Mesh(eyeGeo, eyeM);
  eyeL.position.set(-0.26, 0.24, 0.66);
  const eyeR = eyeL.clone();
  eyeR.position.x = 0.26;
  head.add(eyeL, eyeR);

  const ears = [];
  [-0.62, 0.62].forEach((x) => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.17, 5, 4), fur);
    e.position.set(x, 0.6, 0.2);
    e.castShadow = true;
    head.add(e);
    ears.push(e);
  });

  const mouthAnchor = new THREE.Object3D();
  mouthAnchor.position.set(0, -0.25, 1.0);
  head.add(mouthAnchor);

  /* ---------- Effects: sound rings + hearts ---------- */
  const effects = [];
  const ringGeo = new THREE.RingGeometry(0.85, 1.0, 40);
  function spawnRing() {
    const p = new THREE.Vector3();
    mouthAnchor.getWorldPosition(p);
    const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0xfff3c0, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false, fog: false
    }));
    m.position.copy(p);
    scene.add(m);
    effects.push({ mesh: m, age: 0, life: 1.1,
      update(dt, fx) {
        fx.age += dt;
        const k = fx.age / fx.life;
        fx.mesh.scale.setScalar(0.5 + k * 7);
        fx.mesh.material.opacity = 0.85 * (1 - k);
        fx.mesh.quaternion.copy(camera.quaternion);
        if (fx.age >= fx.life) { scene.remove(fx.mesh); fx.mesh.material.dispose(); return false; }
        return true;
      } });
  }

  const heartShape = new THREE.Shape();
  heartShape.moveTo(0.25, 0.25);
  heartShape.bezierCurveTo(0.25, 0.25, 0.2, 0, 0, 0);
  heartShape.bezierCurveTo(-0.3, 0, -0.3, 0.35, -0.3, 0.35);
  heartShape.bezierCurveTo(-0.3, 0.55, -0.1, 0.77, 0.25, 0.95);
  heartShape.bezierCurveTo(0.6, 0.77, 0.8, 0.55, 0.8, 0.35);
  heartShape.bezierCurveTo(0.8, 0.35, 0.8, 0, 0.5, 0);
  heartShape.bezierCurveTo(0.35, 0, 0.25, 0.25, 0.25, 0.25);
  const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 0.12, bevelEnabled: true, bevelSize: 0.04, bevelThickness: 0.04, bevelSegments: 1 });
  heartGeo.center();
  function spawnHeart() {
    const p = new THREE.Vector3();
    head.getWorldPosition(p);
    p.x += (Math.random() - 0.5) * 0.8;
    p.y += Math.random() * 0.4;
    p.z += (Math.random() - 0.5) * 0.5;
    const m = new THREE.Mesh(heartGeo, new THREE.MeshStandardMaterial({
      color: 0xe8455a, emissive: 0x902030, flatShading: true, roughness: 0.6, transparent: true, fog: false
    }));
    m.rotation.z = Math.PI;
    m.scale.setScalar(0.15);
    m.position.copy(p);
    scene.add(m);
    effects.push({ mesh: m, age: 0, life: 1.7, sway: Math.random() * 6,
      update(dt, fx) {
        fx.age += dt;
        const k = fx.age / fx.life;
        fx.mesh.position.y += dt * 1.4;
        fx.mesh.position.x += Math.sin(fx.age * 5 + fx.sway) * dt * 0.4;
        fx.mesh.rotation.y += dt * 2;
        fx.mesh.scale.setScalar(0.15 + k * 0.22);
        fx.mesh.material.opacity = k < 0.8 ? 1 : 1 - (k - 0.8) / 0.2;
        if (fx.age >= fx.life) { scene.remove(fx.mesh); fx.mesh.material.dispose(); return false; }
        return true;
      } });
  }

  /* ---------- Food ---------- */
  const food = new THREE.Group();
  const meat = new THREE.Mesh(new THREE.IcosahedronGeometry(0.24, 0), M(0xb4442e));
  meat.castShadow = true;
  const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.5, 5), M(0xede7da));
  bone.rotation.z = Math.PI / 2;
  food.add(meat, bone);
  food.position.set(0.75, -2, 1.8);
  food.visible = false;
  food.castShadow = true;
  world.add(food);

  /* ---------- Audio (Web Audio API) ---------- */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function distCurve(k) {
    const n = 256, c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      c[i] = ((3 + k) * x * 20 * (Math.PI / 180)) / (Math.PI + k * Math.abs(x));
    }
    return c;
  }
  function playRoar() {
    ensureAudio();
    const ctx = audioCtx, t0 = ctx.currentTime, d = 1.6;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, t0);
    master.gain.exponentialRampToValueAtTime(0.45, t0 + 0.1);
    master.gain.setValueAtTime(0.45, t0 + d - 0.5);
    master.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    master.connect(ctx.destination);

    const lfo = ctx.createOscillator(); lfo.frequency.value = 11;
    const lfoG = ctx.createGain(); lfoG.gain.value = 130;
    lfo.connect(lfoG);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 420; filter.Q.value = 5;
    lfoG.connect(filter.frequency);

    const shaper = ctx.createWaveShaper();
    shaper.curve = distCurve(25);
    filter.connect(shaper);
    shaper.connect(master);

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, t0);
    osc.frequency.exponentialRampToValueAtTime(85, t0 + 0.25);
    osc.frequency.exponentialRampToValueAtTime(50, t0 + d);
    const vib = ctx.createOscillator(); vib.frequency.value = 6;
    const vibG = ctx.createGain(); vibG.gain.value = 7;
    vib.connect(vibG); vibG.connect(osc.frequency);
    osc.connect(filter);

    const len = ctx.sampleRate, nbuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const ch = nbuf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = nbuf; noise.loop = true;
    const nfil = ctx.createBiquadFilter();
    nfil.type = 'bandpass'; nfil.frequency.value = 260;
    const ng = ctx.createGain(); ng.gain.value = 0.4;
    noise.connect(nfil); nfil.connect(ng); ng.connect(filter);

    [osc, vib, lfo, noise].forEach((n) => { n.start(t0); n.stop(t0 + d + 0.05); });
  }

  /* ---------- Touch controls ---------- */
  const pointers = new Map();
  let lastPinch = 0;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) lastPinch = pinchDist();
  });
  function pinchDist() {
    const p = [...pointers.values()];
    return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  }
  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      cam.theta -= dx * 0.006;
      cam.phi = THREE.MathUtils.clamp(cam.phi + dy * 0.005, 0.25, 1.45);
    } else if (pointers.size === 2) {
      const d = pinchDist();
      if (lastPinch > 0) cam.radius = THREE.MathUtils.clamp(cam.radius * (lastPinch / d), 4.5, 16);
      lastPinch = d;
    }
    updateCamera();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) =>
    canvas.addEventListener(ev, (e) => pointers.delete(e.pointerId))
  );
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.radius = THREE.MathUtils.clamp(cam.radius * (1 + Math.sign(e.deltaY) * 0.1), 4.5, 16);
    updateCamera();
  }, { passive: false });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  /* ---------- Actions ---------- */
  const action = { name: 'idle', t: 0 };
  let spawnTimer = 0;
  function setAction(name) {
    action.name = name;
    action.t = 0;
    spawnTimer = 0;
  }
  document.getElementById('btnRoar').addEventListener('click', () => {
    ensureAudio();
    playRoar();
    setAction('roar');
  });
  document.getElementById('btnPet').addEventListener('click', () => setAction('pet'));
  document.getElementById('btnFeed').addEventListener('click', () => setAction('feed'));

  /* ---------- Day / Night ---------- */
  let nightTarget = 0, nightAmt = 0;
  const nightBtn = document.getElementById('btnNight');
  const nightLabel = document.getElementById('nightLabel');
  nightBtn.querySelector('.ico').textContent = '🌙';
  nightBtn.addEventListener('click', () => {
    nightTarget = nightTarget ? 0 : 1;
    nightLabel.textContent = nightTarget ? 'День' : 'Ночь';
    nightBtn.querySelector('.ico').textContent = nightTarget ? '☀️' : '🌙';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', nightTarget ? '#0d1230' : '#9ed4f5');
  });

  /* ---------- Animation loop ---------- */
  const clock = new THREE.Clock();
  let blinkTimer = 2.5, blinkPhase = -1, appliedSleep = 0;
  const lerp = THREE.MathUtils.lerp;

  setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 4500);

  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    action.t += dt;

    /* day-night */
    nightAmt += (nightTarget - nightAmt) * Math.min(1, dt * 1.5);
    scene.background.lerpColors(SKY, NIGHT, nightAmt);
    scene.fog.color.copy(scene.background);
    sun.intensity = lerp(1.4, 0.3, nightAmt);
    sun.color.lerpColors(new THREE.Color(0xffe8c0), new THREE.Color(0x8fa8ff), nightAmt);
    hemi.intensity = lerp(0.95, 0.3, nightAmt);
    hemi.color.lerpColors(hemiSky, hemiGroundN, nightAmt);
    moon.intensity = nightAmt * 0.7;
    stars.material.opacity = nightAmt;
    stars.rotation.y += dt * 0.01;

    /* sleep amount (at night in idle) */
    const sleepGoal = (nightTarget === 1 && action.name === 'idle') ? 1 : 0;
    appliedSleep += (sleepGoal - appliedSleep) * Math.min(1, dt * 1.8);

    /* island floating + clouds */
    world.position.y = Math.sin(t * 0.8) * 0.15;
    clouds.forEach((c) => {
      c.userData.angle += dt * 0.08;
      c.position.x = Math.cos(c.userData.angle) * 8;
      c.position.z = Math.sin(c.userData.angle) * 8;
    });

    /* breathing */
    const breathSpeed = lerp(2.2, 1.1, appliedSleep);
    const br = Math.sin(t * breathSpeed);
    torso.scale.set(1.35 + br * 0.02, 1 + br * 0.05, 1 + br * 0.02);

    /* idle head sway */
    head.rotation.z = Math.sin(t * 0.9) * 0.04;

    /* blink */
    blinkTimer -= dt;
    if (blinkTimer <= 0 && blinkPhase < 0) blinkPhase = 0;
    let blinkVal = 1;
    if (blinkPhase >= 0) {
      blinkPhase += dt / 0.22;
      if (blinkPhase >= 1) { blinkPhase = -1; blinkTimer = lerp(2, 5, Math.random()); }
      else blinkVal = Math.max(0.05, blinkPhase < 0.5 ? 1 - blinkPhase * 2 : (blinkPhase - 0.5) * 2);
    }
    let eyeY = blinkVal;
    if (action.name === 'pet') eyeY = Math.min(eyeY, 0.28);
    eyeY = Math.min(eyeY, lerp(1, 0.08, appliedSleep));
    eyeL.scale.y = eyeR.scale.y = eyeY;
    if (action.name === 'pet') { eyeL.scale.x = eyeR.scale.x = 1.25; } else { eyeL.scale.x = eyeR.scale.x = 1; }

    /* tail sway */
    const wagFast = action.name === 'pet';
    const tailSpeed = wagFast ? 14 : lerp(3, 1.2, appliedSleep);
    const tailAmp = wagFast ? 0.45 : lerp(0.25, 0.08, appliedSleep);
    tailSegs.forEach((seg, i) => {
      seg.rotation.y = Math.sin(t * tailSpeed + i * 0.7) * tailAmp;
      seg.rotation.x = (i === TAIL_SEGS - 1 ? 0.9 : 0) + Math.sin(t * tailSpeed * 0.7 + i) * tailAmp * 0.3;
    });

    /* action timelines */
    let jawOpen = 0, headPitch = 0;
    if (action.name === 'roar') {
      const T = action.t;
      const env = Math.min(1, T / 0.35) * Math.min(1, Math.max(0, (1.7 - T) / 0.4));
      headPitch = -0.75 * env;
      jawOpen = env;
      head.rotation.z += Math.sin(T * 40) * 0.03 * env;
      spawnTimer -= dt;
      if (T > 0.15 && T < 1.05 && spawnTimer <= 0) { spawnRing(); spawnTimer = 0.18; }
      if (T > 1.7) setAction('idle');
    } else if (action.name === 'pet') {
      const T = action.t;
      const env = Math.min(1, T / 0.3) * Math.min(1, Math.max(0, (2 - T) / 0.4));
      headPitch = 0.18 * env;
      body.rotation.z = Math.sin(T * 6) * 0.04 * env;
      spawnTimer -= dt;
      if (T < 1.7 && spawnTimer <= 0) { spawnHeart(); spawnTimer = 0.28; }
      if (T > 2) { setAction('idle'); body.rotation.z = 0; }
    } else if (action.name === 'feed') {
      const T = action.t;
      if (T < 0.8) {
        food.visible = true;
        const k = T / 0.8;
        food.position.y = 5 - (5 - 0.22) * (k * k);
        food.rotation.y += dt * 4;
      } else if (T < 0.95) {
        food.position.y = 0.22;
        food.rotation.y = 0;
      } else if (T < 1.5) {
        const u = (T - 0.95) / 0.55;
        lion.position.y = Math.sin(u * Math.PI) * 0.55;
        body.rotation.x = -0.15 * Math.sin(u * Math.PI);
      } else if (T < 2.1) {
        lion.position.y = 0; body.rotation.x = 0;
        const k = (T - 1.5) / 0.6;
        food.scale.setScalar(Math.max(0.001, 1 - k));
        food.position.y = 0.22 + k * 0.1;
      } else {
        food.visible = false;
        food.scale.setScalar(1);
        food.position.y = -2;
        setAction('idle');
      }
    } else {
      body.rotation.z *= 0.9;
      headPitch = appliedSleep > 0 ? 0.55 * appliedSleep : 0;
    }
    head.rotation.x = lerp(head.rotation.x, headPitch, Math.min(1, dt * 8));
    jaw.rotation.x = lerp(jaw.rotation.x, jawOpen * 0.75, Math.min(1, dt * 10));

    /* lion lying down at night */
    lion.position.y = action.name === 'feed' ? lion.position.y : lerp(lion.position.y, -0.55 * appliedSleep, Math.min(1, dt * 3));
    if (action.name !== 'feed') body.rotation.x = lerp(body.rotation.x, 0.12 * appliedSleep, Math.min(1, dt * 3));

    /* effects */
    for (let i = effects.length - 1; i >= 0; i--) if (!effects[i].update(dt, effects[i])) effects.splice(i, 1);

    renderer.render(scene, camera);
  });

  /* ---------- Resize ---------- */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})().catch((e) => { showErr(e); });
</script>
</body>
</html>
